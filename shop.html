<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All Jewelry — SFASELIN | sfaselin.shop</title>
<meta name="description" content="Browse the full Sfaselin collection — kundan chokers, pearl earrings, gold-plated bangles, rings, anklets and maang tikkas. Filter by category, price and finish.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a160d'/%3E%3Ctext x='16' y='21' font-size='15' text-anchor='middle' fill='%23c8a877' font-family='Georgia'%3ES%3C/text%3E%3C/svg%3E">
</head>
<body data-page="shop">
<header class="site-header" id="site-header"></header>
<nav class="mobile-nav" id="mobile-nav"></nav>
<div id="cart-root"></div>
<div id="search-root"></div>

<main>
  <section class="page-hero">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> / Shop</div>
      <h1>The <em>collection</em></h1>
    </div>
  </section>

  <section class="section--tight" style="padding-top:2.5rem">
    <div class="wrap">
      <div class="shop-layout">
        <aside class="filters">
          <div class="filters__group">
            <h3>Search</h3>
            <div class="field">
              <input type="text" id="shop-search" placeholder="Search pieces…" aria-label="Search products" style="border:1px solid var(--line-strong);background:transparent;padding:.7rem .9rem;font-size:14px;outline:none;width:100%">
            </div>
          </div>
          <div class="filters__group">
            <h3>Category</h3>
            <div id="filter-cats"></div>
          </div>
          <div class="filters__group">
            <h3>Price</h3>
            <div id="filter-price"></div>
          </div>
          <div class="filters__group">
            <button class="link-line" id="clear-filters">Clear all filters</button>
          </div>
        </aside>

        <div>
          <div class="shop-toolbar">
            <span class="shop-toolbar__count" id="shop-count"></span>
            <select class="sort-select" id="shop-sort" aria-label="Sort products">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="discount">Biggest Discount</option>
              <option value="rating">Top Rated</option>
            </select>
          </div>
          <div class="product-grid" id="shop-grid"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
